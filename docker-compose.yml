services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -d matters: without it, pg_isready probes a database named after the
      # user (libpq default), which doesn't exist here, and Postgres logs a
      # spurious "database ${POSTGRES_USER} does not exist" FATAL every
      # interval even though the server is perfectly healthy.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build: ./ml-service
    env_file:
      - ./ml-service/.env
    ports:
      - '8001:8001'

  protected-api:
    build: ./protected-api
    env_file:
      - ./protected-api/.env
    # Intentionally no host port mapping — per docs/architecture.md §15/§17,
    # protected-api is only reachable from the `backend` (WAF) container on the
    # internal compose network, never directly from the host/internet.

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ML_SERVICE_URL: http://ml-service:8001
      PROTECTED_API_URL: http://protected-api:3001
      # Must match the frontend's host-mapped port below — the browser sends
      # this as its Origin header, and CORS (backend/src/main.ts) only
      # allows this exact origin, never a wildcard.
      FRONTEND_URL: http://localhost:3002
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
      protected-api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        # Read by the browser, which runs on the host — not the compose
        # network — so this must be the host-mapped backend URL, not the
        # internal service DNS name (http://backend:3000). Baked in at
        # BUILD time (see frontend/Dockerfile), so `--build` is required
        # whenever this value changes.
        NEXT_PUBLIC_ADMIN_API_URL: http://localhost:3000
    env_file:
      - ./frontend/.env
    ports:
      - '3002:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
